name: Deploy butian to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        # 用 npm install 而非 npm ci：lockfile 在 Windows 上生成，npm 的平台 optional 依赖
        # bug（npm/cli#4828）使 linux 二进制（@typescript/*、@rolldown/binding-*）不进 lockfile，
        # npm ci 会漏装导致构建缺原生绑定；install 会按当前平台补装，版本仍由 lockfile 锁定
        run: npm install --no-audit --no-fund
      - name: Build and checks
        run: |
          npm run build
          npm run test:smoke
          npm run test:astro
          npm run test:render
          npm run test:interaction
        working-directory: apps/butian
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/butian/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
