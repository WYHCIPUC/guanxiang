name: Deploy butian to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/butian/package-lock.json
      - name: Install dependencies
        # --workspaces=false：避免 npm 向上找到仓库根的不完整 lockfile（会漏装平台原生包）
        run: npm ci --workspaces=false
        working-directory: apps/butian
      - name: Build and checks
        run: |
          npm run build
          npm run test:smoke
          npm run test:astro
          npm run test:render
          npm run test:interaction
        working-directory: apps/butian
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/butian/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
