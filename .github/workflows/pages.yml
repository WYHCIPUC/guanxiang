name: Deploy butian to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        # npm 的平台 optional 依赖 bug（npm/cli#4828）：Windows 生成的 lockfile 只含 win32 二进制，
        # linux 上 npm ci/install 都不会补装 linux 原生绑定。typescript 的已用 lockfile 条目补齐；
        # rolldown binding 与其主包版本严格绑定，按实际安装的 rolldown 版本显式补装。
        run: |
          npm install --no-audit --no-fund
          ROLLDOWN_VER=$(node -p "require('./apps/butian/node_modules/rolldown/package.json').version")
          npm install --no-save --no-audit "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VER"
      - name: Build and checks
        run: |
          npm run build
          npm run test:smoke
          npm run test:astro
          npm run test:render
          npm run test:interaction
        working-directory: apps/butian
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/butian/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
