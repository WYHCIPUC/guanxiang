  <text x="540" y="470" text-anchor="middle" font-size="30" fill="#2c2632" font-family="serif">「昼见如太白，芒角四出，色赤白，凡见二十三日。」</text>
  <text x="540" y="508" text-anchor="middle" font-size="22" fill="#6c5844" font-family="serif">—— 《宋会要辑稿》</text>
