    <script>
      // 双击文件时保留无依赖预览；通过开发服务器或静态托管访问时进入组件化版本。

    <style>
      :root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#f2ebdd;background:#0b1020;--bg:#0b1020;--panel:#121b31;--gold:#c9a45c;--muted:#b9c0cf;--moon:#d9e2ee;--red:#b94a48}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at 50% -20%,#22345f 0,var(--bg) 45%)}button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.app{width:min(1120px,calc(100% - 36px));margin:auto;padding:26px 0 44px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;border:1px solid rgba(201,164,92,.6);border-radius:50%;display:grid;place-items:center;color:var(--gold);font:22px serif}.eyebrow{margin:0;color:var(--muted);font-size:12px;letter-spacing:.16em}.brand h1{margin:2px 0 0;font:600 22px serif;letter-spacing:.18em}.place{background:none;border:0;color:var(--muted);cursor:pointer}.hero{padding:58px 0 24px;max-width:680px}.kicker{color:#9fb2bc;font-size:12px;letter-spacing:.16em}.hero h2{margin:14px 0 12px;font:500 clamp(40px,6vw,70px)/1.06 serif}.hero h2 em{color:var(--gold);font-style:normal}.hero p{margin:0;color:var(--muted);font-size:17px;line-height:1.8}.card{border:1px solid rgba(222,220,210,.14);background:linear-gradient(180deg,rgba(24,35,58,.94),rgba(11,16,32,.98));border-radius:20px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.24)}.bar{padding:18px 22px;border-bottom:1px solid rgba(222,220,210,.14);display:flex;justify-content:space-between;align-items:center}.bar strong{display:block;margin-top:6px;font:500 20px serif}.modes{display:flex;gap:4px;padding:4px;border:1px solid rgba(222,220,210,.14);border-radius:10px}.mode{border:0;background:transparent;border-radius:7px;padding:8px 12px;color:var(--muted);cursor:pointer;font-size:13px}.mode.active{color:#f2ebdd;background:rgba(201,164,92,.16)}.sky{position:relative;height:min(64vw,600px);min-height:420px;overflow:hidden;background:radial-gradient(circle at 50% 44%,rgba(40,67,111,.36),transparent 45%),linear-gradient(160deg,#111d39,#090e1c 70%)}.sky:before,.sky:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.92) 0 1px,transparent 1.6px),radial-gradient(circle,rgba(201,164,92,.7) 0 1px,transparent 1.8px);background-size:110px 90px,160px 130px;background-position:12px 20px,48px 30px;opacity:.38}.sky:after{background-size:220px 190px;background-position:80px 50px;opacity:.2}.glow{position:absolute;border-radius:50%;filter:blur(8px);opacity:.34}.g1{width:280px;height:280px;left:35%;top:25%;background:rgba(90,132,194,.22)}.g2{width:180px;height:180px;right:9%;top:8%;background:rgba(201,164,92,.15)}.milky{position:absolute;width:150%;height:35%;left:-25%;top:42%;background:linear-gradient(100deg,transparent 0 20%,rgba(199,215,232,.08) 38%,rgba(199,215,232,.12) 50%,transparent 70%);transform:rotate(-18deg);filter:blur(22px)}.lines{position:absolute;inset:0;width:100%;height:100%;opacity:.72}.lines line{stroke-width:.24;vector-effect:non-scaling-stroke;stroke-linecap:round}.china{stroke:var(--gold);stroke-dasharray:4 2}.west{stroke:var(--moon);stroke-width:.18}.star{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);border:0;border-radius:50%;background:none;cursor:pointer;z-index:2}.core{display:block;width:var(--s);height:var(--s);margin:auto;border-radius:50%;background:#fff8df;box-shadow:0 0 13px 3px rgba(255,242,189,.56);transition:transform .18s}.star:hover .core,.star.sel .core{transform:scale(1.45);box-shadow:0 0 0 5px rgba(201,164,92,.16),0 0 18px 5px rgba(255,242,189,.72)}.label{display:block;margin-top:7px;white-space:nowrap;color:var(--gold);font:12px serif;text-shadow:0 2px 8px #05070f}.caption{position:absolute;bottom:18px;left:22px;color:rgba(242,235,221,.5);font-size:12px}.time{padding:18px 22px 8px;border-top:1px solid rgba(222,220,210,.14)}.time-head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.time-head strong{color:#f2ebdd;font-size:16px;font-weight:500}.time input{width:100%;accent-color:var(--gold);margin:15px 0 4px}.scale{display:flex;justify-content:space-between;color:rgba(185,192,207,.62);font-size:11px}.actions{display:flex;gap:10px;padding:14px 22px 22px}.primary,.secondary,.cta{min-height:44px;border-radius:9px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;cursor:pointer}.primary,.cta{color:#15131a;background:var(--gold);font-weight:700}.secondary{color:#f2ebdd;background:rgba(217,226,238,.07);border-color:rgba(222,220,210,.14)}.actions .primary{flex:1}.hint{display:flex;gap:14px;align-items:center;margin:18px 0;padding:16px 18px;border:1px solid rgba(201,164,92,.26);border-radius:14px;background:rgba(201,164,92,.06)}.seal{width:36px;height:36px;border:1px solid rgba(201,164,92,.56);border-radius:50%;display:grid;place-items:center;color:var(--gold);font:16px serif}.hint strong{font:16px serif}.hint p{margin:3px 0 0;color:var(--muted);font-size:13px}.flip{margin-left:auto;border:0;background:none;color:var(--gold);cursor:pointer}.floating{position:fixed;right:24px;bottom:24px;z-index:10;width:min(360px,calc(100% - 40px));padding:22px;border:1px solid rgba(201,164,92,.38);border-radius:16px;background:rgba(18,27,49,.97);box-shadow:0 24px 60px rgba(0,0,0,.38)}.floating h3{margin:10px 0 3px;font:30px serif}.muted{margin:0;color:var(--muted);font-size:13px}.floating p{line-height:1.75;color:#e4dfd5;font-size:14px}.source{margin:14px 0;color:#8c99ad;font-size:11px;line-height:1.5}.cta{width:100%}.reading{display:grid;gap:5px;margin:16px 0;color:#f2ebdd;font:18px serif}.link{width:100%;margin-top:10px;border:0;background:none;color:var(--gold);cursor:pointer}.backdrop{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(2,4,10,.76);backdrop-filter:blur(10px)}.modal{width:min(620px,100%);padding:26px;border:1px solid rgba(201,164,92,.35);border-radius:18px;background:#111a2f;box-shadow:0 30px 100px rgba(0,0,0,.4)}.modal-head{display:flex;justify-content:space-between;gap:20px}.modal h2{margin:10px 0 0;font:500 clamp(26px,4vw,36px)/1.2 serif}.close{width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer}.instrument{position:relative;height:230px;margin:24px 0 20px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(201,164,92,.26);border-radius:14px;background:radial-gradient(circle,rgba(201,164,92,.11),transparent 52%),#0a1021}.instrument:before,.instrument:after{content:"";position:absolute;border:1px dashed rgba(201,164,92,.24);border-radius:50%}.instrument:before{width:220px;height:220px}.instrument:after{width:150px;height:150px}.ring{position:absolute;border:2px solid rgba(201,164,92,.64);border-radius:50%;transform:rotate(-18deg)}.outer{width:210px;height:160px}.inner{width:148px;height:108px;border-color:rgba(217,226,238,.46);transform:rotate(28deg)}.cross{position:relative;width:74px;height:74px;border:1px solid var(--gold);border-radius:50%;z-index:2}.cross:before{content:"";position:absolute;left:50%;top:7px;bottom:7px;border-left:1px solid var(--gold)}.cross:after{content:"";position:absolute;top:50%;left:7px;right:7px;border-top:1px solid var(--gold)}.target{position:absolute;top:20px;right:22px;color:var(--gold);font:16px serif}.copy{margin:0;color:var(--muted);line-height:1.7;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 10px}.grid div{padding:12px;border:1px solid rgba(222,220,210,.14);border-radius:10px;background:rgba(255,255,255,.03)}.grid small{display:block;color:var(--muted);font-size:11px}.grid strong{display:block;margin-top:6px;color:var(--gold);font:18px serif}.note{color:#8b98ad!important;font-size:12px!important}.modal-actions{display:flex;gap:10px;margin-top:22px}.modal-actions .primary{flex:1}.welcome{text-align:center;padding:38px 32px 28px}.welcome .seal-big{width:66px;height:66px;display:grid;place-items:center;margin:0 auto 22px;border-radius:50%;background:var(--red);color:#f8e8d0;font:24px serif}.welcome h2{max-width:440px;margin:10px auto 0}.welcome .desc{max-width:470px;margin:18px auto 0;color:var(--muted);line-height:1.8}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:26px 0}.steps span{display:grid;gap:4px;color:var(--muted);font-size:12px}.steps b{color:var(--gold);font:18px serif}.full{width:100%}.small{display:block;margin-top:15px;color:#7d8aa0;font-size:11px}.footer{display:flex;justify-content:space-between;gap:16px;margin-top:24px;color:#778398;font-size:11px}@media(max-width:700px){.app{width:calc(100% - 24px);padding-top:18px}.hero{padding:42px 0 22px}.hero h2{font-size:43px}.bar{display:block}.modes{margin-top:14px;overflow:auto}.mode{flex:1;white-space:nowrap}.sky{height:105vw;min-height:390px}.caption{left:14px;bottom:12px;font-size:10px}.actions{padding:12px 14px 16px}.actions .secondary{width:44px;padding:0;font-size:0}.hint{align-items:flex-start}.flip{font-size:0}.flip:after{content:"翻转 ↻";font-size:13px}.floating{right:12px;bottom:12px;width:calc(100% - 24px)}.modal{padding:22px 18px}.modal-actions{flex-direction:column-reverse}.footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>

  <body>
    <main class="app">
      <header class="top"><div class="brand"><span class="mark">步</span><div><p class="eyebrow">今夜观星 · 原型切片</p><h1>步天</h1></div></div><button class="place" id="placeBtn">北京 · 20:30 ▾</button></header>
      <section class="hero"><p class="kicker">● 你正在值守观星台</p><h2>同一片天空，<em>两套名字。</em></h2><p>先看见星，再选择古人如何称呼它。今晚从参宿开始。</p></section>
      <section class="card"><div class="bar"><div><p class="eyebrow">当前天区</p><strong id="modeTitle">中国星官</strong></div><div class="modes"><button class="mode active" data-mode="china">中国星官</button><button class="mode" data-mode="western">西方星座</button><button class="mode" data-mode="both">叠合观天</button></div></div><div class="sky" id="sky"><div class="glow g1"></div><div class="glow g2"></div><div class="milky"></div><svg class="lines" viewBox="0 0 100 100" id="lines"></svg><div class="caption">示意天区 · 星点与读数为原型演示数据</div></div><div class="time"><div class="time-head"><span>夜行时间</span><strong id="timeLabel">20:30</strong></div><input id="timeRange" type="range" min="0" max="4" value="2"><div class="scale"><span>黄昏</span><span>星升</span><span>深夜</span></div></div><div class="actions"><button class="secondary" id="viewBtn">ⓘ 查看星官</button><button class="primary" id="measureBtn">✦ 测一测 参宿一</button></div></section>
      <section class="hint"><div class="seal">镜</div><div><strong>铜镜提示</strong><p>切换“西方星座”，看看参宿如何变成猎户座。</p></div><button class="flip" id="flipBtn">翻转天空 ↻</button></section>
      <footer class="footer"><span>步天 · 最小可运行原型</span><span>数据与读数均为教学演示</span></footer>
    </main>
    <div id="layer"></div>
    <script>
      const stars=[
        {id:'a',name:'参宿一',modern:'参宿一 · ζ Ori',x:28,y:38,size:13,group:'参宿',west:'猎户座',note:'参宿三星列于天关附近，古人以它们辨认西方天区。'},
        {id:'b',name:'参宿二',modern:'参宿二 · ε Ori',x:36,y:44,size:13,group:'参宿',west:'猎户座',note:'它与参宿一、参宿三组成最容易辨认的三星。'},
        {id:'c',name:'参宿三',modern:'参宿三 · δ Ori',x:44,y:39,size:11,group:'参宿',west:'猎户座',note:'在中国星官语境中，三星是一组有明确礼制和方向感的标记。'},
        {id:'d',name:'参旗',modern:'参旗 · γ Ori',x:49,y:25,size:13,group:'参宿',west:'猎户座',note:'参旗位于参宿附近，像一面被星光撑起的旗。'},
        {id:'e',name:'天关',modern:'天关 · α Ori',x:58,y:32,size:17,group:'参宿',west:'猎户座',note:'天关是这片星区里最醒目的星之一，适合用作观测入口。'},
        {id:'f',name:'玉井',modern:'玉井 · β Ori',x:63,y:62,size:18,group:'参宿',west:'猎户座',note:'玉井是中国星官系统中富有器物意象的一组星。'},
        {id:'g',name:'天枢',modern:'天枢 · α UMa',x:18,y:18,size:12,group:'北斗',west:'大熊座',note:'北斗七星像一柄悬在北天的斗，曾被用来辨方与计时。'},
        {id:'h',name:'天璇',modern:'天璇 · β UMa',x:26,y:13,size:10,group:'北斗',west:'大熊座',note:'天璇与天枢相连，是寻找北极方向的第一步。'},
        {id:'i',name:'天玑',modern:'天玑 · γ UMa',x:35,y:12,size:10,group:'北斗',west:'大熊座',note:'天玑让北斗的斗口向外延伸，形成独特的秩序感。'},
        {id:'j',name:'天权',modern:'天权 · δ UMa',x:44,y:18,size:8,group:'北斗',west:'大熊座',note:'天权是北斗斗身中的一颗星。'},
        {id:'k',name:'玉衡',modern:'玉衡 · ε UMa',x:53,y:26,size:12,group:'北斗',west:'大熊座',note:'玉衡之名带有衡量、校准的意味，适合作为测量隐喻。'},
        {id:'l',name:'开阳',modern:'开阳 · ζ UMa',x:61,y:35,size:11,group:'北斗',west:'大熊座',note:'开阳常与辅星一起被提及，显示古人对细小差异的观察。'}
      ];
      const china=[['a','b'],['b','c'],['a','d'],['c','e'],['e','f'],['g','h'],['h','i'],['i','j'],['j','k'],['k','l']];
      const west=[['a','b'],['b','c'],['d','e'],['e','f'],['a','f'],['g','h'],['h','i'],['i','j'],['j','k'],['k','l']];
      const times=['19:30','20:00','20:30','21:00','21:30']; let mode='china',selected=stars[0];
      const $=id=>document.getElementById(id); const layer=$('layer');
      function draw(){
        $('modeTitle').textContent=mode==='china'?'中国星官':mode==='western'?'西方星座':'叠合观天';
        document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
        const pairs=mode==='western'?west:china, map=new Map(stars.map(s=>[s.id,s]));
        $('lines').innerHTML=pairs.map(([a,b])=>{const x=map.get(a),y=map.get(b);return `<line class="${mode==='western'?'west':'china'}" x1="${x.x}" y1="${x.y}" x2="${y.x}" y2="${y.y}"/>`}).join('');
        document.querySelectorAll('.star').forEach(el=>el.remove());
        stars.forEach(s=>{const el=document.createElement('button');el.className='star'+(selected.id===s.id?' sel':'');el.style.left=s.x+'%';el.style.top=s.y+'%';el.style.setProperty('--s',s.size+'px');el.setAttribute('aria-label','查看'+s.name);el.innerHTML=`<span class="core"></span><span class="label">${mode==='western'?s.west:s.group}</span>`;el.onclick=()=>{selected=s;showInfo()};$('sky').appendChild(el)});
        $('measureBtn').textContent='✦ 测一测 '+selected.name;
      }
      function showInfo(){layer.innerHTML=`<aside class="floating"><button class="close" onclick="layer.innerHTML=''">×</button><p class="eyebrow">${selected.group} · ${selected.west}</p><h3>${selected.name}</h3><p class="muted">${selected.modern}</p><p>${selected.note}</p><div class="source">内容状态：原型手工整理 · 正式版本需补充来源和许可</div><button class="cta" onclick="showMeasure()">选它来测量</button></aside>`}
      function reading(){const base=Math.round(selected.x*1.7+selected.y*.8);return {ru:`入${selected.group} ${base%28}°${String(base%60).padStart(2,'0')}′`,ju:`去极 ${45+base%22}°${String(base*3%60).padStart(2,'0')}′`,ra:`${Math.floor(base/15)}h${String(base%60).padStart(2,'0')}m`,dec:`${base%2?'+':'-'}${String(5+base%28).padStart(2,'0')}°${String(base*2%60).padStart(2,'0')}′`}}
      function showMeasure(){const r=reading();layer.innerHTML=`<div class="backdrop"><section class="modal"><div class="modal-head"><div><p class="eyebrow">第二步 · 测天</p><h2>把准星放在${selected.name}上</h2></div><button class="close" onclick="layer.innerHTML=''">×</button></div><div class="instrument"><div class="ring outer"></div><div class="ring inner"></div><div class="cross"></div><div class="target">${selected.name}</div></div><p class="copy">拖动准星可以感受古人如何用仪器定位一颗星。这里的数字用于理解坐标关系。</p><div class="grid"><div><small>入宿度</small><strong>${r.ru}</strong></div><div><small>去极度</small><strong>${r.ju}</strong></div><div><small>赤经</small><strong>${r.ra}</strong></div><div><small>赤纬</small><strong>${r.dec}</strong></div></div><p class="copy note">教学近似值 · 历元和坐标换算将在正式版本中补充说明</p><div class="modal-actions"><button class="secondary" onclick="layer.innerHTML=''">先不记录</button><button class="primary" onclick="saveRecord()">记入奏折 ↓</button></div></section></div>`}
      function saveRecord(){const r=reading();const place=$('placeBtn').textContent.split(' · ')[0];const rec={star:selected,location:place,time:times[Number($('timeRange').value)],...r};localStorage.setItem('butian-last-observation',JSON.stringify(rec));layer.innerHTML=`<aside class="floating"><p class="eyebrow">最近一次观测</p><h3>${selected.name}</h3><p class="muted">${rec.location} · ${rec.time}</p><div class="reading"><span>${r.ru}</span><span>${r.ju}</span></div><button class="cta" onclick="downloadRecord()">↓ 下载奏折</button><button class="link" onclick="showMeasure()">重新测量</button></aside>`}
      function downloadRecord(){const rec=JSON.parse(localStorage.getItem('butian-last-observation'));const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280"><rect width="900" height="1280" fill="#efe1bf"/><rect x="38" y="38" width="824" height="1204" rx="10" fill="none" stroke="#a67d42" stroke-width="3"/><circle cx="450" cy="118" r="38" fill="#b94a48"/><text x="450" y="128" text-anchor="middle" font-size="28" fill="#f5ead7">步天</text><text x="450" y="225" text-anchor="middle" font-size="44" fill="#2c2632">星图奏折</text><text x="450" y="280" text-anchor="middle" font-size="24" fill="#6c5844">钦天监学徒习测 · 中国星官</text><text x="450" y="450" text-anchor="middle" font-size="54" fill="#2c2632">${rec.star.name}</text><text x="450" y="510" text-anchor="middle" font-size="26" fill="#6c5844">${rec.star.modern}</text><text x="450" y="620" text-anchor="middle" font-size="31" fill="#2c2632">${rec.location} · ${rec.time}</text><text x="450" y="720" text-anchor="middle" font-size="32" fill="#2c2632">${rec.ru}</text><text x="450" y="780" text-anchor="middle" font-size="32" fill="#2c2632">${rec.ju}</text><text x="450" y="900" text-anchor="middle" font-size="30" fill="#2c2632">现代坐标：${rec.ra} · ${rec.dec}</text><text x="450" y="1030" text-anchor="middle" font-size="22" fill="#7d6c58">教学近似值，非专业天文观测结果</text></svg>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='步天-星图奏折.svg';a.click()}
      document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});$('flipBtn').onclick=()=>{mode=mode==='china'?'western':mode==='western'?'both':'china';draw()};$('measureBtn').onclick=()=>showMeasure();$('viewBtn').onclick=()=>showInfo();$('timeRange').oninput=e=>{$('timeLabel').textContent=times[e.target.value];$('placeBtn').textContent=$('placeBtn').textContent.split(' · ')[0]+' · '+times[e.target.value]+' ▾'};let placeIndex=0;const places=['北京','上海','广州'];$('placeBtn').onclick=()=>{placeIndex=(placeIndex+1)%places.length;$('placeBtn').textContent=places[placeIndex]+' · '+times[Number($('timeRange').value)]+' ▾'};
      draw();
      if(localStorage.getItem('butian-preview-seen')!=='1'){layer.innerHTML=`<div class="backdrop"><section class="modal welcome"><div class="seal-big">步天</div><p class="eyebrow">欢迎来到观星台</p><h2>今夜，你值守一片有两套名字的天空。</h2><p class="desc">先从参宿开始。点击铜镜切换命名方式，点一颗星查看星官，再用简化浑仪完成一次教学测量。</p><div class="steps"><span><b>01</b>看星</span><span><b>02</b>翻转</span><span><b>03</b>测量</span><span><b>04</b>记天</span></div><button class="primary full" onclick="localStorage.setItem('butian-preview-seen','1');layer.innerHTML=''">开始观星 →</button><small class="small">原型范围：参宿—猎户及少量示例星点</small></section></div>`}
    </script>
  </body>
